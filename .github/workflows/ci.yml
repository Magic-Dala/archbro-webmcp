# Runs the test suite and proves the deployment image still builds and boots.
#
# The suite talks to a real PostgreSQL: tests/test_postgres_foundation.py skips
# itself when DATABASE_URL is absent, so without the service below the
# PostgreSQL repository would go untested and CI would still be green.
name: CI

on:
  push:
    # Re-test the exact merge/squash commit before deployment. PR-head CI alone
    # is not sufficient because the merge commit is a distinct Git object.
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: archbro
          POSTGRES_PASSWORD: archbro
          POSTGRES_DB: archbro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archbro -d archbro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://archbro:archbro@localhost:5432/archbro
      # Matches the Compose defaults, so CI exercises the same configuration
      # the team runs locally. No API key and no Google credentials required.
      ARCHBRO_PROVIDER: fake
      ARCHBRO_ENV: local
      ARCHBRO_AUTH_MODE: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install ".[test]"

      - name: Test
        run: python -m pytest

      - name: Fail if the PostgreSQL suite silently skipped
        # A missing or unreachable DATABASE_URL turns the PostgreSQL tests into
        # skips rather than failures, which would let a broken repository ship
        # behind a green check. Assert they actually ran.
        run: |
          python -m pytest tests/test_postgres_foundation.py -q --collect-only > /dev/null
          python -m pytest tests/test_postgres_foundation.py -q 2>&1 | tee result.txt
          if grep -qE '[0-9]+ skipped' result.txt; then
            echo "::error::PostgreSQL tests skipped - DATABASE_URL is not reaching them"
            exit 1
          fi

      - name: Fail if the browser-auth suite silently skipped
        # The sign-in flows are covered by Node suites the test skips when node
        # is absent. Runners ship Node today, so this passes; if that ever
        # changes the sign-in coverage would vanish behind a green check.
        run: |
          python -m pytest tests/test_firebase_browser_auth.py -q 2>&1 | tee browser.txt
          if grep -qE '[0-9]+ skipped' browser.txt; then
            echo "::error::Browser-auth tests skipped - node is not available"
            exit 1
          fi

  image:
    runs-on: ubuntu-latest

    # The image needs a database to start at all now that PostgreSQL is the
    # only backend, so proving it boots means giving it one. Without this the
    # probe fails with a connection error and says nothing about the image.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: archbro
          POSTGRES_PASSWORD: archbro
          POSTGRES_DB: archbro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archbro -d archbro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build the deployment image
        run: docker build -t archbro:ci .

      - name: Boot it and check the liveness probe
        # --network host rather than -p: the container has to reach the service
        # container, which is published on the runner's own localhost.
        run: |
          docker run -d --name archbro-ci --network host \
            -e PORT=8080 \
            -e ARCHBRO_PROVIDER=fake \
            -e ARCHBRO_PERSISTENCE=postgres \
            -e DATABASE_URL=postgresql://archbro:archbro@localhost:5432/archbro \
            archbro:ci
          curl --retry 40 --retry-delay 1 --retry-all-errors --max-time 90 \
            --fail -s http://localhost:8080/healthz
          docker rm -f archbro-ci

  # Preserve the existing main ruleset's required status name while making it
  # an explicit aggregate gate for the real test/image jobs. Once repository
  # rulesets are updated they may require this single stable check.
  python-gate:
    name: Python
    if: always()
    needs: [test, image]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          test "$TEST_RESULT" = "success"
          test "$IMAGE_RESULT" = "success"
