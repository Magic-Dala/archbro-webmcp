# The single entry point for the VM. Both environment stacks join the external
# `archbro-edge` network and are reachable only through this proxy, which is why
# neither stack publishes a port of its own.
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      ARCHBRO_MAIN_HOST: ${ARCHBRO_MAIN_HOST:?set ARCHBRO_MAIN_HOST in deploy/caddy/.env}
      ARCHBRO_DEV_HOST: ${ARCHBRO_DEV_HOST:?set ARCHBRO_DEV_HOST in deploy/caddy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    restart: unless-stopped

networks:
  edge:
    external: true
    name: archbro-edge

volumes:
  caddy-data:
  caddy-config:
